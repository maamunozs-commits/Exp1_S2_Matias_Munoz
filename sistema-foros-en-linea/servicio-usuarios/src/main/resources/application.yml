server:
  port: ${PUERTO_USUARIOS:8081}
spring:
  application:
    name: servicio-usuarios
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
    username: ${ORACLE_USUARIO_USUARIOS:MM_USUARIOS}
    password: ${ORACLE_CLAVE_USUARIOS}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
seguridad:
  jwt:
    secreto: ${JWT_SECRETO}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
